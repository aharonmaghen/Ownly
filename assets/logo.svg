<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 70" role="img" aria-label="Ownly">
  <title>Ownly</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="156" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- O: precision ring -->
  <circle cx="16" cy="34" r="14" fill="#0284c7" fill-opacity="0.07"/>
  <circle cx="16" cy="34" r="14" fill="none" stroke="url(#g)" stroke-width="1.75"/>
  <!-- O: center mark -->
  <circle cx="16" cy="34" r="2.75" fill="url(#g)"/>

  <!-- wnly wordmark -->
  <text
    x="34"
    y="48"
    font-family="'Helvetica Neue', -apple-system, Helvetica, Arial, sans-serif"
    font-size="50"
    font-weight="300"
    letter-spacing="-1"
    fill="url(#g)">wnly</text>

  <!-- accent rule -->
  <line x1="0" y1="64" x2="134" y2="64"
    stroke="url(#g)" stroke-width="1.2"
    stroke-linecap="round" opacity="0.38"/>
</svg>
